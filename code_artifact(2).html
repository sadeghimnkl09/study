    /** Sub-Tab 2.2: تقویم ماهانه هجری شمسی تعاملی */
    function changeCalendarMonth(delta) {
      let m = calViewMonth + delta;
      let y = calViewYear;
      if (m > 12) { m = 1; y++; }
      else if (m < 1) { m = 12; y--; }
      calViewYear = y;
      calViewMonth = m;
      renderApp();
    }

    function selectCalendarDay(jKey) {
      calSelectedDate = jKey;
      renderApp();
    }

    function renderMonthlySubTab(schedule) {
      if (!calViewYear || !calViewMonth) {
        const cur = parseJalaliKey(schedule.todayJKey);
        calViewYear = cur.jy;
        calViewMonth = cur.jm;
      }
      if (!calSelectedDate) calSelectedDate = schedule.todayJKey;

      const monthLen = jalaliMonthLength(calViewYear, calViewMonth);
      const firstDayJdn = j2d(calViewYear, calViewMonth, 1);
      const startOffset = persianWeekdayIndex(firstDayJdn); // 0=شنبه .. 6=جمعه

      const cells = [];
      for (let i = 0; i < startOffset; i++) {
        cells.push(`<div class="cal-cell empty"></div>`);
      }

      const examsByDate = {};
      state.exams.forEach(ex => {
        if (!examsByDate[ex.date]) examsByDate[ex.date] = [];
        examsByDate[ex.date].push(ex);
      });

      for (let d = 1; d <= monthLen; d++) {
        const jKey = toJalaliKey(calViewYear, calViewMonth, d);
        const dayPlan = schedule.dayMap[jKey];
        const isToday = jKey === schedule.todayJKey;
        const isDeadline = jKey === schedule.deadlineJKey;
        const isSelected = jKey === calSelectedDate;
        const dayExams = examsByDate[jKey] || [];

        const logObj = state.dailyLogs[jKey];
        const loggedSum = logObj ? Object.values(logObj).reduce((s, v) => s + (Number(v) || 0), 0) : 0;
        const isPast = jalaliKeyToJDN(jKey) < jalaliKeyToJDN(schedule.todayJKey);
        const isAfterDeadline = jalaliKeyToJDN(jKey) > jalaliKeyToJDN(schedule.deadlineJKey);

        const passColor = (dayPlan && dayPlan.dominantPass !== null) ? PASS_INFO[dayPlan.dominantPass].hex : null;

        cells.push(`
          <button type="button" onclick="selectCalendarDay('${jKey}')"
            class="cal-cell ${isToday ? 'is-today' : ''} ${isDeadline ? 'is-deadline' : ''} ${isSelected ? 'selected' : ''} ${(isPast && loggedSum === 0) || isAfterDeadline ? 'outside' : ''}">
            <span class="cal-day-num">${toFaNum(d)}</span>
            ${dayPlan && dayPlan.totalPages > 0 ? `
              <span class="cal-pages-tag" style="color:${passColor}; background:rgba(255,255,255,0.06);">${toFaNum(dayPlan.totalPages)}ص</span>
            ` : loggedSum > 0 ? `
              <span class="cal-pages-tag" style="color:var(--emerald);">✓${toFaNum(loggedSum)}</span>
            ` : `<span class="text-xxs" style="color:transparent;">.</span>`}
            <div class="cal-indicators">
              ${passColor ? `<span class="cal-pass-bar" style="background:${passColor};"></span>` : ''}
              ${dayExams.length > 0 ? `<span class="dot dot-amber" style="width:6px;height:6px;"></span>` : ''}
              ${loggedSum > 0 && (!dayPlan || loggedSum >= dayPlan.totalPages) ? `<span style="font-size:8px; color:var(--emerald); font-weight:900;">✓</span>` : ''}
            </div>
          </button>
        `);
      }

      // Details panel for selected day
      const selPlan = schedule.dayMap[calSelectedDate];
      const selExams = examsByDate[calSelectedDate] || [];
      const selLogs = state.dailyLogs[calSelectedDate] || {};
      const selLoggedEntries = Object.entries(selLogs).filter(([, v]) => v > 0);

      return `
        <div class="stack-md">
          <section class="card card-compact">
            <!-- Month Navigation Header -->
            <div class="flex-between" style="margin-bottom:12px;">
              <button onclick="changeCalendarMonth(-1)" class="icon-btn" aria-label="ماه قبل">
                <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
              </button>
              <div style="text-align:center;">
                <div class="h3-title">${JALALI_MONTHS[calViewMonth - 1]} ${toFaNum(calViewYear)}</div>
                <button onclick="const t=parseJalaliKey(getActiveJKey()); calViewYear=t.jy; calViewMonth=t.jm; calSelectedDate=getActiveJKey(); renderApp();" class="text-xxs font-bold" style="color:var(--cyan);">پرش به امروز</button>
              </div>
              <button onclick="changeCalendarMonth(1)" class="icon-btn" aria-label="ماه بعد">
                <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
              </button>
            </div>

            <!-- Weekdays Header -->
            <div class="cal-weekdays">
              ${JALALI_WEEKDAY_SHORT.map(w => `<div>${w}</div>`).join('')}
            </div>

            <!-- Days Grid -->
            <div class="cal-grid">
              ${cells.join('')}
            </div>

            <!-- Legend -->
            <div class="flex-wrap" style="justify-content:center; margin-top:11px; padding-top:9px; border-top:1px solid rgba(30,41,59,0.75); font-size:10px; color:var(--text-muted);">
              <span><i class="dot dot-cyan" style="width:6px;height:6px;"></i> مطالعه</span>
              <span><i class="dot dot-indigo" style="width:6px;height:6px;"></i> مرور ۱</span>
              <span><i class="dot dot-amber" style="width:6px;height:6px;"></i> مرور ۲ / آزمون</span>
              <span><i class="dot dot-emerald" style="width:6px;height:6px;"></i> مرور ۳</span>
              <span><i class="dot dot-rose" style="width:6px;height:6px;"></i> ددلاین</span>
            </div>
          </section>

          <!-- Selected Day Detail Panel -->
          <section class="card card-compact stack-sm">
            <div class="flex-between">
              <div>
                <p class="text-xxs font-bold" style="color:var(--cyan);">جزئیات روز انتخابی</p>
                <h3 class="h3-title">${formatJalaliDisplay(calSelectedDate, true)}</h3>
              </div>
              ${selPlan ? `<span class="badge badge-indigo">${toFaNum(selPlan.totalPages)} صفحه</span>` : ''}
            </div>

            ${selExams.map(ex => `
              <div class="alert-box alert-amber">
                📝 <strong>آزمون:</strong> ${escapeHtml(ex.title)} (${toFaNum(ex.durationHours)} ساعت)
              </div>
            `).join('')}

            ${selPlan && selPlan.tasks.length > 0 ? `
              <div class="stack-xs">
                ${selPlan.tasks.map(t => `
                  <div class="inner-row">
                    <div style="min-width:0;">
                      <div class="flex-wrap" style="margin-bottom:2px;">
                        <span class="dot ${t.colorMeta.dot}"></span>
                        <span class="text-xxs font-bold" style="color:${t.colorMeta.textColor};">${escapeHtml(t.courseName)}</span>
                        <span class="badge ${t.slice.passInfo.badgeClass}">${t.slice.passInfo.short}</span>
                      </div>
                      <p class="text-xs font-bold truncate">${escapeHtml(t.bookTitle)}</p>
                      <p class="text-xxs" style="color:var(--text-muted);">${t.slice.rangeText}</p>
                    </div>
                    <span class="text-xs font-extrabold" style="color:var(--cyan); flex-shrink:0;">${toFaNum(t.targetPages)} ص</span>
                  </div>
                `).join('')}
              </div>
            ` : selLoggedEntries.length > 0 ? `
              <div class="stack-xs">
                <p class="text-xxs font-bold" style="color:var(--emerald);">گزارش مطالعه انجام‌شده در این روز:</p>
                ${selLoggedEntries.map(([bid, pages]) => {
                  const b = findBookById(bid);
                  return `<div class="inner-row"><span class="text-xs font-bold truncate">${b ? escapeHtml(b.title) : 'منبع'}</span><span class="badge badge-emerald">${toFaNum(pages)} صفحه</span></div>`;
                }).join('')}
              </div>
            ` : `
              <p class="subtext" style="text-align:center; padding:10px;">
                ${jalaliKeyToJDN(calSelectedDate) > jalaliKeyToJDN(schedule.deadlineJKey)
                  ? 'این تاریخ بعد از ددلاین تعیین‌شده است.'
                  : 'برنامه مطالعه‌ای برای این تاریخ ثبت نشده است.'}
              </p>
            `}
          </section>
        </div>
      `;
    }

    /** Sub-Tab 2.3: نمای هفتگی (Next 7 Days) */
    function renderWeeklySubTab(schedule) {
      const next7 = schedule.days.slice(0, 7);
      if (next7.length === 0) {
        return `<div class="card card-compact" style="text-align:center; padding:24px;"><p class="subtext">برنامه‌ای برای ۷ روز آینده وجود ندارد.</p></div>`;
      }

      return `
        <div class="stack-sm">
          ${next7.map((day, idx) => `
            <div class="card card-compact stack-xs">
              <div class="flex-between">
                <div>
                  <div class="flex-wrap">
                    <span class="h3-title">${formatJalaliDisplay(day.jKey, true)}</span>
                    ${idx === 0 ? `<span class="badge badge-cyan">امروز</span>` : idx === 1 ? `<span class="badge badge-indigo">فردا</span>` : ''}
                  </div>
                  <p class="text-xxs" style="color:var(--text-muted); margin-top:2px;">
                    ظرفیت مطالعه: ${toFaNum(Math.round(day.weight * 100))}٪
                    ${day.exams.length > 0 ? ` • ${toFaNum(day.exams.length)} آزمون` : ''}
                  </p>
                </div>
                <span class="badge ${day.dominantPass !== null ? PASS_INFO[day.dominantPass].badgeClass : 'badge-cyan'}" style="font-size:11px; padding:4px 9px;">
                  ${toFaNum(day.totalPages)} صفحه
                </span>
              </div>

              ${day.exams.map(ex => `
                <div class="alert-box alert-amber" style="padding:6px 10px;">
                  📝 آزمون: <strong>${escapeHtml(ex.title)}</strong> (${toFaNum(ex.durationHours)} ساعت)
                </div>
              `).join('')}

              ${day.tasks.length === 0 ? `
                <p class="text-xxs" style="color:var(--text-dim); padding:4px 0;">بدون سهمیه مطالعه در این روز</p>
              ` : `
                <div class="stack-xs" style="padding-top:4px; border-top:1px solid rgba(30,41,59,0.75);">
                  ${day.tasks.map(t => `
                    <div class="flex-between text-xs">
                      <div class="flex-center" style="justify-content:flex-start; min-width:0;">
                        <span class="dot ${t.colorMeta.dot}"></span>
                        <span class="truncate" style="color:var(--text-secondary);">${escapeHtml(t.bookTitle)}</span>
                        <span class="badge ${t.slice.passInfo.badgeClass}" style="padding:1px 6px;">${t.slice.passInfo.short}</span>
                      </div>
                      <span class="font-extrabold" style="color:var(--cyan); flex-shrink:0;">${toFaNum(t.targetPages)} ص</span>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          `).join('')}
        </div>
      `;
    }

    /* -----------------------------------------------------------------------
     * TAB 3: دروس و منابع
     * ----------------------------------------------------------------------- */
    function renderCoursesTab() {
      let html = `
        <div class="stack-md animate-tab">
          <div class="flex-between">
            <div>
              <h2 class="h2-title">دروس و منابع درسی</h2>
              <p class="subtext">هر کتاب به‌صورت خودکار ۴ دور (۱ مطالعه + ۳ مرور) تنظیم می‌شود</p>
            </div>
            <button onclick="openCourseModal()" class="btn btn-primary btn-sm" style="flex-shrink:0;">+ درس جدید</button>
          </div>

          <div class="card card-compact flex-between">
            <div class="flex-center" style="justify-content:flex-start; min-width:0;">
              <span>⚡</span>
              <span class="subtext font-bold truncate" style="color:var(--text-secondary);">چارت کامل مهندسی برق (۷ درس)</span>
            </div>
            <div class="flex-center" style="gap:6px; flex-shrink:0;">
              <button onclick="confirmLoadFullEESample()" class="btn btn-indigo btn-sm">بارگذاری چارت برق</button>
              ${state.courses.length > 0 ? `<button onclick="confirmClearAllCourses()" class="btn btn-rose btn-sm">پاکسازی</button>` : ''}
            </div>
          </div>
      `;

      if (state.courses.length === 0) {
        html += `
          <div class="card" style="text-align:center; padding:30px 16px;">
            <p class="h3-title" style="margin-bottom:6px;">لیست دروس خالی است</p>
            <p class="subtext">دروس دلخواه خود را اضافه کنید یا چارت مهندسی برق را با یک کلیک بارگذاری نمایید.</p>
          </div>
        `;
      } else {
        for (const course of state.courses) {
          const color = getColorMeta(course.color);
          const cTotal = course.books.reduce((s, b) => s + b.totalPages * 4, 0);
          const cDone = course.books.reduce((s, b) => s + Math.min(b.totalPages * 4, b.completedUnits), 0);
          const cPct = cTotal > 0 ? Math.round((cDone / cTotal) * 100) : 0;

          html += `
            <div class="card stack-sm">
              <div class="flex-between">
                <div class="flex-center" style="justify-content:flex-start; min-width:0;">
                  <span class="dot ${color.dot}" style="width:10px; height:10px;"></span>
                  <div style="min-width:0;">
                    <h3 class="h3-title truncate">${escapeHtml(course.name)}</h3>
                    <p class="subtext">${toFaNum(course.books.length)} منبع • پیشرفت ۴ دور: ${toFaNum(cPct)}٪</p>
                  </div>
                </div>
                <div class="flex-center" style="gap:5px; flex-shrink:0;">
                  <button onclick="openCourseModal('${course.id}')" class="icon-btn" style="width:30px; height:30px;" aria-label="ویرایش درس">
                    <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                  </button>
                  <button onclick="confirmDeleteCourse('${course.id}')" class="icon-btn" style="width:30px; height:30px; color:var(--rose); border-color:var(--rose-border); background:var(--rose-bg);" aria-label="حذف درس">
                    <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  </button>
                </div>
              </div>

              <div class="progress-track progress-track-sm">
                <div class="progress-fill ${color.fill}" style="width:${cPct}%"></div>
              </div>

              <div class="stack-xs">
                ${course.books.length === 0 ? `<p class="subtext" style="text-align:center; padding:8px;">هنوز کتاب یا منبعی ثبت نشده است.</p>` : ''}
                ${course.books.map(book => {
                  const maxU = book.totalPages * 4;
                  const pct = maxU > 0 ? Math.round((Math.min(maxU, book.completedUnits) / maxU) * 100) : 0;
                  const curPass = book.completedUnits >= maxU
                    ? 'تکمیل ۴ دور ✓'
                    : PASS_INFO[Math.min(3, Math.floor(book.completedUnits / book.totalPages))].label;

                  return `
                    <div class="inner-row">
                      <div style="min-width:0; flex:1;">
                        <p class="text-xs font-bold truncate">${escapeHtml(book.title)}</p>
                        <div class="flex-wrap" style="margin-top:3px;">
                          <span class="text-xxs" style="color:var(--text-muted);">${toFaNum(book.totalPages)} ص (کل ۴ دور: ${toFaNum(maxU)} ص)</span>
                          <span class="text-xxs" style="color:var(--text-dim);">•</span>
                          <span class="text-xxs font-bold" style="color:var(--cyan);">${curPass} (${toFaNum(pct)}٪)</span>
                        </div>
                      </div>
                      <div class="flex-center" style="gap:5px; flex-shrink:0;">
                        <button onclick="openBookModal('${course.id}', '${book.id}')" class="icon-btn" style="width:28px; height:28px;" aria-label="ویرایش منبع">
                          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </button>
                        <button onclick="confirmDeleteBook('${course.id}', '${book.id}')" class="icon-btn" style="width:28px; height:28px; color:var(--rose); background:var(--rose-bg); border-color:var(--rose-border);" aria-label="حذف منبع">
                          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <button onclick="openBookModal('${course.id}')" class="btn-dashed">
                + افزودن منبع / کتاب به ${escapeHtml(course.name)}
              </button>
            </div>
          `;
        }
      }

      html += `</div>`;
      return html;
    }

    /* -----------------------------------------------------------------------
     * TAB 4: آزمون‌ها
     * ----------------------------------------------------------------------- */
    function renderExamsTab() {
      const todayJdn = jalaliKeyToJDN(getActiveJKey());
      const sortedExams = [...state.exams].sort((a, b) => jalaliKeyToJDN(a.date) - jalaliKeyToJDN(b.date));
      const upcoming = sortedExams.filter(e => !e.completed && jalaliKeyToJDN(e.date) >= todayJdn);
      const pastOrDone = sortedExams.filter(e => e.completed || jalaliKeyToJDN(e.date) < todayJdn);

      return `
        <div class="stack-md animate-tab">
          <div>
            <h2 class="h2-title">مدیریت آزمون‌ها</h2>
            <p class="subtext">ظرفیت مطالعه در روز آزمون بر اساس ساعت آزمون کاهش یافته و در سایر روزها توزیع می‌شود</p>
          </div>

          <div class="grid-2">
            <button onclick="openSingleExamModal()" class="card card-compact" style="text-align:right; border-color:var(--cyan-border); background:linear-gradient(135deg, rgba(34,211,238,0.14), rgba(99,102,241,0.12));">
              <div class="badge badge-cyan" style="margin-bottom:7px; font-size:13px;">+</div>
              <div class="text-xs font-extrabold">افزودن آزمون تکی</div>
              <div class="text-xxs" style="color:var(--text-muted); margin-top:2px;">تاریخ شمسی و مدت به ساعت</div>
            </button>

            <button onclick="openBatchExamsModal()" class="card card-compact" style="text-align:right; border-color:var(--amber-border); background:linear-gradient(135deg, rgba(245,158,11,0.15), rgba(244,63,94,0.12));">
              <div class="badge badge-amber" style="margin-bottom:7px;">تولید دوره‌ای</div>
              <div class="text-xs font-extrabold">سری آزمون‌ها تا ددلاین</div>
              <div class="text-xxs" style="color:var(--text-muted); margin-top:2px;">مثلاً هر ۱۴ روز یک‌بار</div>
            </button>
          </div>

          <div class="stack-sm">
            <div class="flex-between">
              <h3 class="text-xs font-extrabold" style="color:var(--text-secondary);">آزمون‌های پیش‌رو (${toFaNum(upcoming.length)})</h3>
              ${state.exams.length > 0 ? `<button onclick="confirmClearExams()" class="text-xxs font-bold" style="color:var(--rose);">حذف همه</button>` : ''}
            </div>

            ${upcoming.length === 0 ? `
              <div class="card card-compact" style="text-align:center; padding:22px;">
                <p class="subtext">هیچ آزمون پیش‌رویی ثبت نشده است.</p>
              </div>
            ` : upcoming.map(ex => {
              const daysRem = jalaliKeyToJDN(ex.date) - todayJdn;
              const weightPct = Math.round(getDayWeight(ex.date) * 100);
              return `
                <div class="card card-compact flex-between">
                  <div class="flex-center" style="justify-content:flex-start; min-width:0;">
                    <button onclick="toggleExamDone('${ex.id}')" class="check-box" style="width:24px; height:24px; border-color:var(--amber); margin-top:0;" aria-label="تکمیل آزمون"></button>
                    <div style="min-width:0;">
                      <p class="text-xs font-extrabold truncate">${escapeHtml(ex.title)}</p>
                      <div class="flex-wrap" style="margin-top:3px;">
                        <span class="text-xxs font-bold" style="color:var(--amber);">${formatJalaliDisplay(ex.date, true)}</span>
                        <span class="badge badge-cyan" style="padding:1px 6px;">${daysRem === 0 ? 'امروز' : `${toFaNum(daysRem)} روز دیگر`}</span>
                      </div>
                      <p class="text-xxs" style="color:var(--text-muted); margin-top:2px;">مدت: ${toFaNum(ex.durationHours)} ساعت • ظرفیت مطالعه آن روز: ${toFaNum(weightPct)}٪</p>
                    </div>
                  </div>
                  <button onclick="deleteExam('${ex.id}')" class="icon-btn" style="width:28px; height:28px; color:var(--rose); background:var(--rose-bg); border-color:var(--rose-border); flex-shrink:0;" aria-label="حذف آزمون">
                    <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                  </button>
                </div>
              `;
            }).join('')}
          </div>

          ${pastOrDone.length > 0 ? `
            <div class="stack-xs" style="padding-top:4px;">
              <h3 class="text-xs font-bold" style="color:var(--text-muted);">آزمون‌های گذشته / انجام‌شده (${toFaNum(pastOrDone.length)})</h3>
              ${pastOrDone.map(ex => `
                <div class="inner-row" style="opacity:0.72;">
                  <div class="flex-center" style="justify-content:flex-start; min-width:0;">
                    <button onclick="toggleExamDone('${ex.id}')" class="check-box ${ex.completed ? 'checked' : ''}" style="width:22px; height:22px; margin-top:0;">
                      ${ex.completed ? `<svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>` : ''}
                    </button>
                    <div style="min-width:0;">
                      <p class="text-xs font-bold ${ex.completed ? 'line-through' : ''} truncate">${escapeHtml(ex.title)}</p>
                      <p class="text-xxs" style="color:var(--text-dim);">${formatJalaliDisplay(ex.date)} • ${toFaNum(ex.durationHours)} ساعت</p>
                    </div>
                  </div>
                  <button onclick="deleteExam('${ex.id}')" class="subtext" style="color:var(--text-dim);">✕</button>
                </div>
              `).join('')}
            </div>

    function saveCourse(courseId) {
      const name = document.getElementById('course-name-input').value.trim();

    function openBookModal(courseId, bookId = null) {
      const course = state.courses.find(c => c.id === courseId);
      if (!course) return;
      const existing = bookId ? course.books.find(b => b.id === bookId) : null;

      let curPassIdx = 0;
      let curPageInPass = 0;
      if (existing && existing.completedUnits > 0) {
        if (existing.completedUnits >= existing.totalPages * 4) {
          curPassIdx = 3; curPageInPass = existing.totalPages;
        } else {
          curPassIdx = Math.floor(existing.completedUnits / existing.totalPages);
          curPageInPass = existing.completedUnits % existing.totalPages;
        }
      }

      openModal(existing ? 'ویرایش منبع / کتاب' : `افزودن منبع به ${course.name}`, `
        <div class="stack-md">
          <div>
            <label class="form-label">نام کتاب یا جزوه</label>
            <input id="book-title-input" type="text" placeholder="مثلاً: ریاضی مهندسی کرزیگ" value="${existing ? escapeHtml(existing.title) : ''}" class="form-input" />
          </div>
          <div>
            <label class="form-label">تعداد کل صفحات کتاب</label>
            <input id="book-pages-input" type="number" min="1" max="5000" placeholder="مثلاً: 250" value="${existing ? existing.totalPages : ''}" class="form-input" />
          </div>
          <div class="grid-2">
            <div>
              <label class="form-label">دور فعلی (اختیاری)</label>
              <select id="book-pass-input" class="form-select">
                ${PASS_INFO.map(p => `<option value="${p.index}" ${p.index === curPassIdx ? 'selected' : ''}>${p.label}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="form-label">صفحات خوانده‌شده در این دور</label>
              <input id="book-done-pages-input" type="number" min="0" max="5000" value="${curPageInPass}" class="form-input" />
            </div>
          </div>
          <div class="flex-between" style="padding-top:4px;">
            <button onclick="saveBook('${courseId}', '${bookId || ''}')" class="btn btn-primary" style="flex:1;">${existing ? 'ذخیره تغییرات' : 'افزودن منبع'}</button>
            <button onclick="closeModal()" class="btn btn-ghost">انصراف</button>
          </div>
        </div>
      `);
    }

    function saveBook(courseId, bookId) {
      const course = state.courses.find(c => c.id === courseId);
      if (!course) return;
      const title = document.getElementById('book-title-input').value.trim();
      const totalPages = parseInt(document.getElementById('book-pages-input').value, 10);
      const passIdx = Math.min(3, Math.max(0, parseInt(document.getElementById('book-pass-input').value, 10) || 0));
      const doneInPass = Math.max(0, parseInt(document.getElementById('book-done-pages-input').value, 10) || 0);

      if (!title || !totalPages || totalPages < 1) {
        showToast('نام کتاب و تعداد صفحات معتبر وارد کنید', 'error');
        return;
      }

      const completedUnits = Math.min(totalPages * 4, passIdx * totalPages + Math.min(totalPages, doneInPass));
      if (bookId) {
        const b = course.books.find(x => x.id === bookId);
        if (b) { b.title = title; b.totalPages = totalPages; b.completedUnits = completedUnits; }
        showToast('منبع ویرایش شد', 'success');
      } else {
        course.books.push({ id: uid('b'), title, totalPages, completedUnits });
        showToast(`منبع «${title}» اضافه شد`, 'success');
      }
      saveState();
      closeModal();
      renderApp();
    }

    function generateBatchExams() {
      const prefix = document.getElementById('batch-prefix-input').value.trim() || 'آزمون مرحله';
      const interval = parseInt(document.getElementById('batch-interval-input').value, 10);
      const hours = parseFloat(document.getElementById('batch-hours-input').value);
      if (!interval || interval < 2 || !hours || hours <= 0) {
        showToast('فاصله روز و مدت آزمون معتبر وارد کنید', 'error');
        return;
      }

      const startJdn = jalaliKeyToJDN(getActiveJKey());
      const endJdn = jalaliKeyToJDN(state.settings.deadline);
      let count = 0;
      for (let jdn = startJdn + interval; jdn <= endJdn && count < 60; jdn += interval) {
        count++;
        const { jy, jm, jd } = d2j(jdn);
        state.exams.push({
          id: uid('ex'),
          title: `${prefix} ${toFaNum(count)}`,
          date: toJalaliKey(jy, jm, jd),
          durationHours: hours,
          completed: false
        });
      }

      saveState();
      closeModal();
      showToast(`${toFaNum(count)} آزمون دوره‌ای (هر ${toFaNum(interval)} روز) تا ددلاین ثبت شد`, 'success');
      renderApp();
    }

      });
    }

    function confirmResetProgressOnly() {
      openConfirmModal('صفر کردن پیشرفت‌ها', 'دروس و کتاب‌ها حفظ می‌شوند اما پیشرفت مطالعه تمام کتاب‌ها به صفر برمی‌گردد. ادامه می‌دهید؟', 'صفر کردن پیشرفت', () => {
        state.courses.forEach(c => c.books.forEach(b => { b.completedUnits = 0; }));
        state.dailyLogs = {};
        saveState();
        showToast('پیشرفت تمام کتاب‌ها صفر شد', 'info');
        renderApp();
      });
    }

    function confirmFullFactoryReset() {
      openConfirmModal('بازنشانی کامل داده‌ها', 'تمام دروس، آزمون‌ها، پیشرفت‌ها و تنظیمات پاک شده و برنامه به حالت اولیه بازمی‌گردد. مطمئن هستید؟', 'بازنشانی کامل', () => {
        localStorage.removeItem(STORAGE_KEY);
        roadmapFilterBookId = 'all';
        loadState();
        showToast('برنامه به حالت اولیه بازنشانی شد', 'info');
        renderApp();
      });
    }

    /*************************************************************************
     * 8. OFFLINE JSON BACKUP EXPORT & IMPORT (WITH JALALI FILENAME)
     *************************************************************************/
    function exportBackupJSON() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `barnameriz-jame-4dor-${getRealTodayJKey()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('فایل پشتیبان با تاریخ شمسی دانلود شد', 'success');
      } catch (err) {
        showToast('خطا در ایجاد فایل پشتیبان', 'error');
      }
    }

    function handleImportFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.courses) || !parsed.settings?.deadline) {
            throw new Error('Invalid schema');
          }
          const migratedLogs = {};
          if (parsed.dailyLogs && typeof parsed.dailyLogs === 'object') {
            for (const k of Object.keys(parsed.dailyLogs)) {
              migratedLogs[normalizeToJalaliKey(k, getRealTodayJKey())] = parsed.dailyLogs[k];
            }
          }
          state = {
            settings: {
              deadline: normalizeToJalaliKey(parsed.settings.deadline, DEFAULT_DEADLINE_JALALI),
              simulatedDate: parsed.settings.simulatedDate
                ? normalizeToJalaliKey(parsed.settings.simulatedDate, null)
                : null
            },
            courses: parsed.courses,
            exams: Array.isArray(parsed.exams)
              ? parsed.exams.map(ex => ({ ...ex, date: normalizeToJalaliKey(ex.date, getRealTodayJKey()) }))
              : [],
            dailyLogs: migratedLogs
          };
          saveState();
          showToast('اطلاعات با موفقیت بازیابی شد ✓', 'success');
          renderApp();
        } catch (err) {
          showToast('فایل انتخاب‌شده معتبر نیست!', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    /*************************************************************************
     * 9. TOASTS, SYSTEM DATE AUTO-DETECTION & BOOTSTRAP
     *************************************************************************/
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-8px)';
        setTimeout(() => el.remove(), 260);
      }, 2700);
    }

    let lastSeenRealDate = getRealTodayJKey();

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      const activeJ = getActiveJKey();
      const cur = parseJalaliKey(activeJ);
      calViewYear = cur.jy;
      calViewMonth = cur.jm;
      calSelectedDate = activeJ;
      renderApp();

      // Auto-detect system date change if app stays open past midnight
      setInterval(() => {
        const nowReal = getRealTodayJKey();
        if (nowReal !== lastSeenRealDate) {
          lastSeenRealDate = nowReal;
          if (!state.settings.simulatedDate) renderApp();
        }
      }, 60000);
    });
  </script>
